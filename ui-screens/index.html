      // Screen views: 'landing' | 'dashboard' | 'my-learning-path' | 'course-catalog' | 'assignments-and-practice' | 'settings'

      const [currentUser, setCurrentUser] = useState(defaultUser);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [learnerRoleView, setLearnerRoleView] = useState('Learner View');

      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('signin'); // 'signin' | 'signup' | 'forgot'

      const [credentialsModalOpen, setCredentialsModalOpen] = useState(false);
      const [sandboxPrecheckModalOpen, setSandboxPrecheckModalOpen] = useState(false);
      const [sandboxQuestionsModalOpen, setSandboxQuestionsModalOpen] = useState(false);
      const [sandboxQuestionsTrack, setSandboxQuestionsTrack] = useState('python');
      const [infoModalData, setInfoModalData] = useState(null);

      // App Data State
      const [courses, setCourses] = useState(initialCourses);
      const [spotlightModule, setSpotlightModule] = useState(initialSpotlightModule);
      const [competencies, setCompetencies] = useState(initialCompetencies);
      const [rsvps, setRsvps] = useState({ ev2: false });
      const [deckSubmitted, setDeckSubmitted] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [verificationBannerVisible, setVerificationBannerVisible] = useState(true);

      // Search & Filters
      const [selectedRole, setSelectedRole] = useState('All Roles');
      const [selectedLevel, setSelectedLevel] = useState('Intermediate');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Realtime listener for Firebase Auth & Firestore User Sync
      useEffect(() => {
        if (authInstance) {
          const unsubscribe = authInstance.onAuthStateChanged(async (firebaseUser) => {
            if (firebaseUser) {
              setIsAuthenticated(true);
              let loadedProfile = {
                uid: firebaseUser.uid,
                email: firebaseUser.email,
                name: firebaseUser.displayName || (firebaseUser.email ? firebaseUser.email.split('@')[0] : "Learner Fellow"),
                role: "Workforce Fellow",
                avatarUrl: firebaseUser.photoURL || defaultUser.avatarUrl,
                track: defaultUser.track,
                cohort: "Cohort #14 • Week 6",
                currentMilestone: "Product Strategy & Discovery",
                milestoneProgress: 68,
                streakDays: 5,
                streakBest: 12,
                xpBonus: 150,
                q1Target: 84,
                studyHours: 4.5,
                targetHours: 6.0,
                emailVerified: firebaseUser.emailVerified
              };

              // Try reading from real Firestore DB
              if (firestoreInstance) {
                try {
                  const docSnap = await firestoreInstance.collection("users").doc(firebaseUser.uid).get();
                  if (docSnap.exists) {
                    const data = docSnap.data();
                    loadedProfile = { ...loadedProfile, ...data };
                  } else {
                    // Create in Firestore
                    await firestoreInstance.collection("users").doc(firebaseUser.uid).set(loadedProfile, { merge: true });
                  }

                  // Load enrollments from Firestore
                  const enrollmentsSnap = await firestoreInstance.collection("enrollments").where("userId", "==", firebaseUser.uid).get();
                  if (!enrollmentsSnap.empty) {
                    const enrolledCourseIds = new Set();
                    enrollmentsSnap.forEach(d => enrolledCourseIds.add(d.data().courseId));
                    setCourses(prev => prev.map(c => enrolledCourseIds.has(c.id) ? { ...c, isEnrolled: true, tag: "Enrolled • In Progress" } : c));
                  }

                  // Load RSVPs
                  const rsvpsSnap = await firestoreInstance.collection("cohort_rsvps").where("userId", "==", firebaseUser.uid).get();
                  if (!rsvpsSnap.empty) {
                    const newRsvps = {};
                    rsvpsSnap.forEach(d => {
                      const data = d.data();
                      newRsvps[data.eventId] = data.isRsvped;
                    });
                    setRsvps(prev => ({ ...prev, ...newRsvps }));
                  }
                } catch (dbErr) {
                  console.warn("Firestore sync error:", dbErr);
                }
              }

              setCurrentUser(loadedProfile);
            } else {
              setIsAuthenticated(false);
            }
          });
          return () => unsubscribe();
        }
      }, []);

      // Toggle checklist item with Real Firestore Sync
      const toggleLesson = (lessonId) => {
        setSpotlightModule(prev => {
          const updatedLessons = prev.lessons.map(l => {
            if (l.id === lessonId) {
              return { ...l, done: !l.done };
            }
            return l;
          });
          const doneCount = updatedLessons.filter(l => l.done).length;
          const pct = Math.round((doneCount / prev.totalLessons) * 100);
          const targetLesson = prev.lessons.find(l => l.id === lessonId);
          const newDoneState = targetLesson ? !targetLesson.done : true;

          // Sync with Firestore DB
          if (firestoreInstance && currentUser.uid) {
            try {
              firestoreInstance.collection("lesson_progress").doc(`${currentUser.uid}_${lessonId}`).set({
                userId: currentUser.uid,
                lessonId,
                isCompleted: newDoneState,
                timestamp: new Date().toISOString()
              }, { merge: true });
            } catch (e) {
              console.warn("Firestore write note:", e);
            }
          }

          showToast(`Lesson ${lessonId} updated! Course progress: ${pct}%`);
          return {
            ...prev,
            lessons: updatedLessons,
            completedLessons: doneCount,
            progressPercent: pct
          };
        });
      };

      // Toggle RSVP with Real Firestore Sync
      const toggleRsvp = (eventId) => {
        const next = !rsvps[eventId];
        setRsvps(prev => ({ ...prev, [eventId]: next }));

        if (firestoreInstance && currentUser.uid) {
          try {
            firestoreInstance.collection("cohort_rsvps").doc(`${currentUser.uid}_${eventId}`).set({
              userId: currentUser.uid,
              eventId,
              isRsvped: next,
              timestamp: new Date().toISOString()
            }, { merge: true });
          } catch (e) {
            console.warn("Firestore RSVP write note:", e);
          }
        }
        showToast(next ? "RSVP Confirmed for Live Q&A with Melissa Chen! ✓" : "RSVP Cancelled");
      };

      // Toggle Bookmark with Real Firestore Sync
      const toggleBookmark = (courseId) => {
        setCourses(prev => prev.map(c => {
          if (c.id === courseId) {
            const next = !c.isBookmarked;
            if (firestoreInstance && currentUser.uid) {
              try {
                firestoreInstance.collection("bookmarks").doc(`${currentUser.uid}_${courseId}`).set({
                  userId: currentUser.uid,
                  courseId,
                  isBookmarked: next,
                  timestamp: new Date().toISOString()
                }, { merge: true });
              } catch (e) {
                console.warn("Firestore bookmark write note:", e);
              }
            }
            showToast(next ? `Bookmarked "${c.title}"` : `Removed bookmark for "${c.title}"`);
            return { ...c, isBookmarked: next };
          }
          return c;
        }));
      };

      // Enroll in course with Real Firestore Sync
      const enrollCourse = (courseId) => {
        setCourses(prev => prev.map(c => {
          if (c.id === courseId) {
            if (firestoreInstance && currentUser.uid) {
              try {
                firestoreInstance.collection("enrollments").doc(`${currentUser.uid}_${courseId}`).set({
                  userId: currentUser.uid,
                  courseId,
                  title: c.title,
                  status: "in_progress",
                  progress: 0,
                  timestamp: new Date().toISOString()
                }, { merge: true });
              } catch (e) {
                console.warn("Firestore enrollment write note:", e);
              }
            }
            showToast(`Enrolled in "${c.title}"! Course added to your learning dashboard.`);
            return { ...c, isEnrolled: true, tag: "Enrolled • In Progress", tagType: "in_progress", progress: 0 };
          }
          return c;
        }));
      };

      // Log study time (+30 minutes interactive goal updater)
      const handleLogStudyTime = () => {
        setCurrentUser(prev => {
          const newHours = Math.min(prev.targetHours, parseFloat((prev.studyHours + 0.5).toFixed(1)));
          const streakIncrement = newHours >= prev.targetHours ? 1 : 0;
          const updated = {
            ...prev,
            studyHours: newHours,
            streakDays: prev.streakDays + streakIncrement,
            xpBonus: prev.xpBonus + 25
          };
          if (firestoreInstance && prev.uid) {
            firestoreInstance.collection("users").doc(prev.uid).set(updated, { merge: true });
          }
          showToast(`Logged +30m study session! Total this week: ${newHours}h / ${prev.targetHours}h (+25 XP)`);
          return updated;
        });
      };

      // Resend Email Verification (Mail Automation)
      const handleResendVerificationEmail = async () => {
        try {
          if (authInstance && authInstance.currentUser) {
            await authInstance.currentUser.sendEmailVerification();
            showToast(`Verification email re-dispatched to ${currentUser.email}! Check your inbox.`);
          } else {
            showToast(`Verification email sent to ${currentUser.email}! (Simulated for demo session)`);
          }
        } catch (err) {
          showToast(`Email error: ${err.message}`);
        }
      };

      // Sign out
      const handleSignOut = () => {
        if (authInstance) {
          authInstance.signOut();
        }
        setIsAuthenticated(false);
        setCurrentScreen('landing');
        showToast("Signed out successfully.");

    function SandboxPrecheckModal({ onClose }) {
      const [camStatus, setCamStatus] = useState('idle');
      const [micStatus, setMicStatus] = useState('idle');
      const [screenStatus, setScreenStatus] = useState('idle');
      const [fsStatus, setFsStatus] = useState('idle');
      const [errMsg, setErrMsg] = useState(null);

      const requestCamAndMic = async () => {
        setErrMsg(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          setCamStatus('granted');
          setMicStatus('granted');
          stream.getTracks().forEach(t => t.stop());
        } catch (err) {
          setCamStatus('denied');
          setMicStatus('denied');
          setErrMsg("Camera/Mic access was denied or unavailable. Please click the lock or camera icon in your browser address bar to allow permissions.");
        }
      };

      const requestScreen = async () => {
        setErrMsg(null);
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'monitor' } });
          setScreenStatus('granted');
          stream.getTracks().forEach(t => t.stop());
        } catch (err) {
          setScreenStatus('denied');
          setErrMsg("Screen sharing cancelled or not granted. You must choose 'Entire screen' in the browser dialog.");
        }
      };

      const requestFullscreen = async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            setFsStatus('granted');
          } else {
            setFsStatus('granted');
          }
        } catch (err) {
          setFsStatus('denied');
          setErrMsg("Fullscreen was blocked by browser. Allow fullscreen mode.");
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

              <p className="text-xs text-slate-500">

              </p>
            </div>

            {errMsg && (
              <div className="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs">
                ⚠️ {errMsg}
              </div>
            )}

            <div className="space-y-3 text-xs mb-6">

                <button
                  onClick={requestCamAndMic}
                  className={`px-3 py-1.5 rounded-lg font-semibold text-xs transition-colors ${
                    camStatus === 'granted' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-indigo-700 text-white hover:bg-indigo-800'
                  }`}
                >
                  {camStatus === 'granted' ? 'Switch ON ✓' : 'Switch ON'}
                </button>
              </div>

              {/* Entire Screen */}
              <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-lg">🖥️</span>
                  <div>
                    <span className="font-bold text-slate-800 block">Entire Screen Sharing</span>

          correct: 'b',
          method: 'deterministic_test',

            { id: 'd', text: '[]' }
          ],

          method: 'deterministic_test',

    function AuthModal({ mode, setMode, onClose, onSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [selectedTrack, setSelectedTrack] = useState('Associate to Senior PM Track');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [resetSent, setResetSent] = useState(false);
      const [verificationSent, setVerificationSent] = useState(false);

      // Google Sign-In via Firebase SDK. Popups are blocked by many browsers (and always
      // blocked in automated/embedded contexts) unless opened synchronously from the click,
      // so fall back to a full-page redirect - the return trip is handled by
      // handleGoogleRedirectResult() below.
      const handleGoogleSignIn = async () => {
        setLoading(true);
        setError('');
        try {
          if (authInstance) {
            const provider = new firebase.auth.GoogleAuthProvider();
            let res;
            try {
              res = await authInstance.signInWithPopup(provider);
            } catch (popupErr) {
              if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(popupErr.code)) {
                await authInstance.signInWithRedirect(provider);
                return; // page is navigating away; nothing left to do here
              }
              throw popupErr;
            }
            const u = res.user;

            const userDoc = {
              uid: u.uid,
              email: u.email,
              name: u.displayName || (u.email ? u.email.split('@')[0] : "Learner Fellow"),
              role: "Workforce Fellow",
              avatarUrl: u.photoURL || defaultUser.avatarUrl,
              track: selectedTrack,
              cohort: "Cohort #14 • Week 6",
              currentMilestone: "Product Strategy & Discovery",
              milestoneProgress: 68,
              streakDays: 5,
              streakBest: 12,
              xpBonus: 150,
              q1Target: 84,
              studyHours: 4.5,
              targetHours: 6.0,
              emailVerified: u.emailVerified
            };

            // Real Firestore synchronization
            if (firestoreInstance) {
              await firestoreInstance.collection("users").doc(u.uid).set(userDoc, { merge: true });
            }

            onSuccess(userDoc);
          } else {
            // Local fallback
            onSuccess(defaultUser);
          }
        } catch (err) {
          console.warn("Google Auth note:", err);
          setError(err.message || "Failed to authenticate with Google.");
        } finally {
          setLoading(false);
        }
      };

      // Email Sign In / Sign Up with Automatic Email Verification Dispatched
      const handleEmailSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (mode === 'signup') {
            let resUser = null;
            if (authInstance) {
              const res = await authInstance.createUserWithEmailAndPassword(email, password);
              resUser = res.user;
              if (name) {
                await resUser.updateProfile({ displayName: name });
              }
              // DISPATCH AUTOMATIC EMAIL VERIFICATION (MAIL AUTOMATION)
              try {
                await resUser.sendEmailVerification();
                setVerificationSent(true);
              } catch (mailErr) {
                console.warn("Email verification automation note:", mailErr);
              }
            }

            const newUserDoc = {
              uid: resUser ? resUser.uid : `uid_${Date.now()}`,
              email: email,
              name: name || email.split('@')[0],
              role: "Workforce Fellow",
              avatarUrl: defaultUser.avatarUrl,
              track: selectedTrack,
              cohort: "Cohort #14 • Week 6",
              currentMilestone: "Orientation & Foundations",
              milestoneProgress: 0,
              streakDays: 1,
              streakBest: 1,
              xpBonus: 50,
              q1Target: 84,
              studyHours: 0,
              targetHours: 6.0,
              emailVerified: false
            };

            // Save in real Firestore DB
            if (firestoreInstance && resUser) {
              await firestoreInstance.collection("users").doc(resUser.uid).set(newUserDoc, { merge: true });
            }

            onSuccess(newUserDoc);
          } else {
            // Sign in
            let resUser = null;
            if (authInstance) {
              const res = await authInstance.signInWithEmailAndPassword(email, password);
              resUser = res.user;
            }

            const existingDoc = {
              uid: resUser ? resUser.uid : `uid_${Date.now()}`,
              email: email,
              name: resUser && resUser.displayName ? resUser.displayName : email.split('@')[0],
              role: "Workforce Fellow",
              avatarUrl: defaultUser.avatarUrl,
              track: selectedTrack,
              cohort: "Cohort #14 • Week 6",
              currentMilestone: "Product Strategy & Discovery",
              milestoneProgress: 68,
              streakDays: 5,
              streakBest: 12,
              xpBonus: 150,
              q1Target: 84,
              studyHours: 4.5,
              targetHours: 6.0,
              emailVerified: resUser ? resUser.emailVerified : true
            };

            onSuccess(existingDoc);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // Forgot Password email automation
      const handlePasswordReset = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (authInstance) {
            await authInstance.sendPasswordResetEmail(email);
          }
          setResetSent(true);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // Fast Demo Login Bypass

        onSuccess(defaultUser);
      };

                <span className="material-symbols-outlined text-[26px]">school</span>
              </div>
              <h2 className="text-2xl font-bold text-slate-900">
                {mode === 'signup' ? 'Create Your Account' : mode === 'forgot' ? 'Reset Password' : 'Sign In to Pathway'}

              <p className="text-xs text-slate-500 mt-1">
                {mode === 'signup' ? 'Join 45,000+ fellows in job-ready skill sandboxes.' : 'Access your workforce track, rubrics, and certificates.'}

                <button onClick={() => { setResetSent(false); setMode('signin'); }} className="mt-3 block text-indigo-700 font-bold hover:underline mx-auto">
                  Back to Sign In

              <form onSubmit={handlePasswordReset} className="flex flex-col gap-3">
                <div>

    // ==========================================
    // 13. RAPID FORMULA QUIZ MODAL
    // ==========================================
    function RapidQuizModal({ userId, onClose, onSubmit }) {
      const questions = [
        {
          q: "1. Which ratio best measures sticky habituation and daily user retention?",
          options: ["DAU / MAU Ratio", "Total Signups / CAC", "Bounce Rate", "CSAT Score"],
          ans: 0
        },
        {
          q: "2. When defining a two-sided marketplace North Star, which focus is most robust?",
          options: ["Total Gross Merchandise App Visits", "Completed Core Transactions", "Total Seller Accounts", "App Store Ratings"],
          ans: 1
        },
        {
          q: "3. What p-value statistical significance threshold is standard in product A/B testing?",
          options: ["p < 0.50", "p < 0.05 (95% Confidence)", "p = 0.00", "p > 0.10"],
          ans: 1
        }
      ];

      const [selected, setSelected] = useState({});

      const handleSubmit = () => {
        let score = 0;
        questions.forEach((q, idx) => {
          if (selected[idx] === q.ans) score++;
        });

        // Write submission to Firestore
        if (firestoreInstance && userId) {
          try {
            firestoreInstance.collection("quiz_submissions").add({
              userId,
              quizId: "product_analytics_rapid",
              score,
              total: 3,
              timestamp: new Date().toISOString()
            });
          } catch (e) {
            console.warn("Quiz Firestore write:", e);
          }
        }

        onSubmit(score);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-200">
            <button onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-slate-600">
              <span className="material-symbols-outlined text-[20px]">close</span>
            </button>

            <div className="mb-4">
              <span className="text-xs font-bold text-indigo-700 uppercase tracking-wider">Product Analytics Lab</span>
              <h3 className="text-xl font-bold text-slate-900">Rapid Metric Formula Quiz</h3>
              <p className="text-xs text-slate-500">Answer all 3 questions to unlock +100 XP and competency credit.</p>
            </div>

            <div className="flex flex-col gap-4 text-xs">
              {questions.map((item, qIdx) => (
                <div key={qIdx} className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                  <p className="font-bold text-slate-800 text-sm mb-2">{item.q}</p>
                  <div className="flex flex-col gap-1.5">
                    {item.options.map((opt, oIdx) => (
                      <label key={oIdx} className="flex items-center gap-2 cursor-pointer p-1.5 rounded-lg hover:bg-white transition-colors">
                        <input
                          type="radio"
                          name={`q-${qIdx}`}
                          checked={selected[qIdx] === oIdx}
                          onChange={() => setSelected(prev => ({ ...prev, [qIdx]: oIdx }))}
                          className="accent-indigo-700"
                        />
                        <span className="text-slate-700">{opt}</span>
                      </label>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <button
              onClick={handleSubmit}
              className="mt-6 w-full py-3 bg-indigo-700 hover:bg-indigo-800 text-white rounded-xl font-bold text-sm shadow-xs transition-all active:scale-95"
            >
              Submit Quiz Answers to Firebase
            </button>
          </div>
        </div>
      );
    }
